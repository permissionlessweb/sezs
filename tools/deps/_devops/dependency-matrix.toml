# SEZS fork pins. Version lines in member Cargo.toml stay on crates.io.
# `just deps-patch-git` rewrites each workspace [patch.crates-io] to these
# published git revs. `just deps-patch-local` rewrites them to relative
# paths under $SEZS_CRATES_ROOT (never committed).

[defaults]
# Local paths in this file are relative to SEZS_CRATES_ROOT.

