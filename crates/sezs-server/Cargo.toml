[package]
name = "sezs-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"
description = "SEZS backend server. Session is first; ticketing, email, and payroll follow. Implements the hash-market SezsService surface once that crate SHA is published."

[lib]
name = "sezs_server"
path = "src/lib.rs"

[[bin]]
name = "sezs-server"
path = "src/bin/sezs-server.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bech32 = "0.9"
bytes = "1"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
ripemd = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
url = "2"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower = "0.4"
sezs-ticket-v2 = { path = "../../circuits/sezs-ticket-v2/circuit", default-features = false }
hash-market = { git = "https://github.com/permissionlessweb/terp-rs", rev = "b782ea404049d87fabd4f72510136fd1a16198b4", default-features = false, features = ["sezs"] }

[dev-dependencies]
hex = "0.4"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
regex = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
