[package]
name = "sezs-outpost"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"
description = "Loopback Bluetooth outpost for usher devices (sezs-0020 / sezs-0021). Simulated transport; no radio in the first version."

[lib]
name = "sezs_outpost"
path = "src/lib.rs"

[[bin]]
name = "sezs-outpost"
path = "src/bin/sezs-outpost.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
