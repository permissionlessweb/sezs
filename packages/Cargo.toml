[workspace]
resolver = "2"
members = ["sezs-orch", "sezs-circuit-orch"]

# Consume the terp-core cw-orchestrator fork the same way terp-rs does:
# [patch.crates-io] so the private cosmwasm-std 4.1 and the MsgStoreCircuit
# cosmrs resolve to path crates. Paths are relative to packages/.  This
# table mirrors the fork workspace patches (entries whose paths exist).

[patch.crates-io]
# Resolve self-referencing git deps to local paths

