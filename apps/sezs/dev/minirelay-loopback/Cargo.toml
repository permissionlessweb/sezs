[package]
name = "sezs-minirelay-loopback"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "SEZS lab wrapper: Zafu minirelay bound to 127.0.0.1 only"

[dependencies]
axum = "0.8"
# Optional local-dev only. Set SEZS_ZAFU_ROOT and patch, or depend on
# a published zafu minirelay revision. Not built by default.
# minirelay = { git = "https://github.com/rotkonetworks/zafu", package = "minirelay" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
