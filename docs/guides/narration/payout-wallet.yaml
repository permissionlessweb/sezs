    type: title-card
    source_app: sezs-titles
    source_device: title-card
    duration_seconds: 3.0
    path: docs/guides/shots/payout-wallet/payout-intro-title.svg
    status: placeholder
    capture_checklist:
    - 'Set the card in the product type: guide title and step id.'
    - 'Use the dark field background #07070a and hot accent #ffb347.'
    - Do not put a seeded event name or a list price on the card.
  transitions: []
  estimated_speech_seconds: 4.3
  word_count: 10
  audio_render:
    tts_path: docs/guides/narration/audio/payout-wallet/tts/payout-intro.aiff
