schema_version: 1.1.0
id: payout-wallet
title: Artist and vendor payout wallet
status: complete
audience: A coordinator who issues a one-time key, and an artist or vendor who registers payout
  addresses.
prerequisites:
- An admin or coordinator session is available for issuing the key.
- The artist or vendor has ZEC and UM addresses.
user_constraints:
- The one-time key is shown once. Do not store it in a public frame.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/payout-wallet.mmd
derived_graphs:
- docs/flows/derived/app-frost-module-deps.mmd
surfaces:
- apps/sezs/src/frost/ParticipantsPanel.tsx
- apps/sezs/pages/register.tsx
- apps/sezs/pages/admin.tsx
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 39.8
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
  tts:
    status: pending
    engine: null
    voice: null
    path: docs/guides/narration/audio/payout-wallet/tts/
    notes: Leave empty until a local offline TTS take is rendered.
  human:
    status: pending
    engine: human
    voice: null
    path: docs/guides/narration/audio/payout-wallet/human/
    notes: Record one take for each step tomorrow. Keep room tone consistent.
steps:
- id: payout-intro
  status: complete
  role: intro
  gap: null
  narration_ste: Let's register a payout wallet for an artist or vendor.
  on_screen_action: Title card
  producer_note: null
  flow_node: Issue
  trail_step: null
  expected_ui:
    route: null
    title: the event
    visible_labels: []
  video_slots:
