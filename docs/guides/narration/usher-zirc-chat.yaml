audience: Door staff who need a sealed staff channel during check-in.
prerequisites:
- An usher or coordinator session is open.
user_constraints:
- Do not send a ticket secret in the usher channel.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
