schema_version: 1.1.0
id: ticket-transfer
title: Transfer a ticket
status: complete
audience: A guest who already holds a ticket in this browser and wants to send a sealed copy to
  a friend.
prerequisites:
- A paid ticket is stored in this browser.
- The friend has a ZID pubkey.
user_constraints:
- This sends a sealed copy. It does not move the ticket on chain.
- Do not put a ticket secret in usher chat or in a screenshot of the friend's key beyond the pubkey
  field.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/ticket-transfer.mmd
derived_graphs:
- docs/flows/derived/app-ticket-vault.mmd
surfaces:
- apps/sezs/src/event/TicketVault.tsx
- apps/sezs/pages/ticket.tsx
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 34.7
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
  tts:
    status: pending
    engine: null
    voice: null
    path: docs/guides/narration/audio/ticket-transfer/tts/
    notes: Leave empty until a local offline TTS take is rendered.
  human:
    status: pending
    engine: human
    voice: null
    path: docs/guides/narration/audio/ticket-transfer/human/
    notes: Record one take for each step tomorrow. Keep room tone consistent.
