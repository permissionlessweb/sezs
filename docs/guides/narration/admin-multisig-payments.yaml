schema_version: 1.1.0
id: admin-multisig-payments
title: Admin signing and payments
status: has_gaps
audience: Event holders who approve artist and vendor payouts with FROST. A DAO path is not in
  the current UI.
prerequisites:
- Holders are on the admin roster.
- Artists or vendors have registered payout addresses.
user_constraints:
- Do not display private shares or spending keys.
- There is no DAO payout screen. Mark that half as a gap.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/admin-multisig-payments.mmd
derived_graphs:
- docs/flows/derived/app-frost-module-deps.mmd
surfaces:
- apps/sezs/pages/admin.tsx
- apps/sezs/src/frost/ParticipantsPanel.tsx
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 44.2
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
  tts:
    status: pending
    engine: null
    voice: null
    path: docs/guides/narration/audio/admin-multisig-payments/tts/
    notes: Leave empty until a local offline TTS take is rendered.
  human:
    status: pending
    engine: human
    voice: null
    path: docs/guides/narration/audio/admin-multisig-payments/human/
    notes: Record one take for each step tomorrow. Keep room tone consistent.
