schema_version: 1.1.0
id: usher-check-in
title: Usher check-in
status: complete
audience: A signed-in usher at the door, and a guest who holds a paid ticket QR.
prerequisites:
- A paid ticket QR is on the guest device. See the ticket purchase guide.
- The usher is signed in and can open Check-in.
user_constraints:
- A passkey session is not a ticket.
- The door uses the ticket QR, not the payment receipt.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
- Unpaid tickets, second uses, and removed ushers are refused.
flow_graph: docs/flows/surfaces/usher-check-in.mmd
derived_graphs:
- docs/flows/derived/app-usher-door.mmd
- docs/flows/derived/app-prepare-consume.mmd
- docs/flows/derived/app-submit-consume.mmd
- docs/flows/derived/circuit-prove.mmd
- docs/flows/derived/manifold-execute.mmd
- docs/flows/derived/manifold-verify.mmd
surfaces:
- apps/sezs/pages/check-in.tsx
- apps/sezs/pages/ticket.tsx
- apps/sezs/src/event/UsherDoor.tsx
- apps/sezs/src/event/door-v3.ts
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 73.2
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
