schema_version: 1.1.0
id: onramp-zec
title: Onramp ZEC
status: has_gaps
audience: A guest who has a ZIP-321 wallet but does not yet hold shielded ZEC for checkout.
prerequisites:
- The install guide is complete.
- A ZIP-321 wallet is on the guest phone or in Zafu.
user_constraints:
- The app has no buy-ZEC or exchange screen. Do not invent one.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/onramp-zec.mmd
derived_graphs:
- docs/flows/derived/app-pay-module-deps.mmd
- docs/flows/derived/app-checkout.mmd
surfaces:
- apps/sezs/pages/tickets.tsx
- apps/sezs/src/pay/zec.ts
event:
