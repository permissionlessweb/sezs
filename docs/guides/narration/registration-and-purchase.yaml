schema_version: 1.1.0
id: registration-and-purchase
title: Registration and ticket purchase
status: complete
audience: A guest who buys a ticket with shielded ZEC, and an artist or vendor who registers payout
  addresses.
prerequisites:
- The install guide is complete.
- The guest wallet holds shielded ZEC.
- 'For the registration half: a coordinator has issued a one-time registration key.'
user_constraints:
- Each ticket is a separate payment with a fresh ticket secret.
- The payment memo carries the commitment only. Signing in is not a ticket.
- The door uses the ticket QR, not the payment receipt.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/registration-and-purchase.mmd
derived_graphs:
- docs/flows/derived/app-checkout.mmd
- docs/flows/derived/app-pay-module-deps.mmd
- docs/flows/derived/sezs-orch-curate.mmd
surfaces:
- apps/sezs/pages/tickets.tsx
- apps/sezs/src/event/CheckoutPanel.tsx
- apps/sezs/pages/register.tsx
- apps/sezs/pages/ticket.tsx
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 95.2
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
  tts:
    status: pending
    engine: null
    voice: null
    path: docs/guides/narration/audio/registration-and-purchase/tts/
    notes: Leave empty until a local offline TTS take is rendered.
  human:
    status: pending
    engine: human
    voice: null
    path: docs/guides/narration/audio/registration-and-purchase/human/
    notes: Record one take for each step tomorrow. Keep room tone consistent.
