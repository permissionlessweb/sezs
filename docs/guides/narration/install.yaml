    status: pending
    engine: null
    voice: null
    path: docs/guides/narration/audio/install/tts/
    notes: Leave empty until a local offline TTS take is rendered.
  human:
    status: pending
    engine: human
    voice: null
    path: docs/guides/narration/audio/install/human/
    notes: Record one take for each step tomorrow. Keep room tone consistent.
