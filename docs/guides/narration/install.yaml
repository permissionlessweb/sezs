schema_version: 1.1.0
id: install
title: Initial installations
status: has_gaps
audience: A new guest or usher who needs a wallet and a site session before any other guide.
prerequisites:
- A desktop browser, and permission to install a browser extension and a phone wallet.
user_constraints:
- Wallet installers live outside this app. Do not invent an in-app store screen.
- A passkey session is not a ticket.
- Do not print keys, passwords, or tokens on a frame or in a spoken line.
flow_graph: docs/flows/surfaces/install.mmd
derived_graphs:
- docs/flows/derived/app-auth-module-deps.mmd
surfaces:
- apps/sezs/pages/keys.tsx
- apps/sezs/src/auth/SignInPanel.tsx
event:
  name: Speak-Ez Sessions
  venue: the venue
  source: event record
timing:
  estimated_speech_seconds: 51.0
  words_per_minute: 140
  notes: Estimate at 140 words each minute. Adjust after the human take.
audio:
