[workspace]
name = "sezs-contracts"
resolver = "2"
members = [
  "cw-event-manifold",
  "packages/sezs-ticket-v2-verify",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/permissionlessweb/sezs"
authors = ["SEZS contributors"]

[workspace.dependencies]
cosmwasm-schema = "2.2.2"
cosmwasm-std = { version = "2.2.2", features = ["cosmwasm_1_2"] }
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
cw-orch = "0.28.0"
schemars = "0.8.22"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.12" }
sha2 = { version = "0.10.2", default-features = false }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
panic = "abort"
rpath = false
overflow-checks = true
